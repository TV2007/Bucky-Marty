<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Your Comic Site</title>
  <meta name="description" content="This page doesn't exist.">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="site-brand" href="index.html">
        <img src="assets/logo.png" alt="" onerror="this.style.display='none'">
        Your Comic Site
      </a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="archive.html">Archive</a>
        <a href="about.html">About</a>
        <a href="#" class="nav-donate" target="_blank" rel="noopener">Support</a>
      </nav>
    </div>
  </header>

  <div class="notfound-wrap">
    <h1>404</h1>
    <p>This page doesn't exist — maybe the link was mistyped, or the comic moved.</p>
    <a href="index.html" class="toolbar-btn">← Back to Home</a>
  </div>

  <footer class="site-footer">
    <p class="footer-copy">&copy; <span class="js-year"></span> YOUR NAME HERE.</p>
  </footer>

  <script>
    document.querySelectorAll('.js-year').forEach(el => el.textContent = new Date().getFullYear());
  </script>
</body>
</html>
